# SPDX-License-Identifier: GPL-2.0-or-later
sonar.host.url=https://sonarcloud.io
sonar.organization=somethingwithproof
sonar.projectKey=somethingwithproof_plugin_cloudflare
sonar.projectName=Cacti Cloudflare Plugin
sonar.sourceEncoding=UTF-8

# Production code only; tests and BDD steps are analysed as tests.
sonar.sources=src,includes,setup.php,cloudflare_accounts.php,js
sonar.tests=tests,features
sonar.exclusions=vendor/**

# Written by `make coverage` in .github/workflows/sonar.yml.
sonar.php.coverage.reportPaths=build/coverage/clover.xml

# The plugin follows Cacti's code style, which php-cs-fixer enforces in CI
# (.php-cs-fixer.dist.php): opening braces on the same line as the
# declaration and snake_case function names, as in Cacti core and its
# plugins. php:S1808 checks PSR-2 layout and php:S100 checks camelCase
# function names, so both report the house style itself as a defect.
sonar.issue.ignore.multicriteria=cactiLayout,cactiFunctionNames,migrationClassNames,cactiIncludesSetup,cactiIncludesPage,cactiIncludesIncludes,cactiHookParamsSetup,cactiHookParamsPage,cactiHookParamsIncludes
sonar.issue.ignore.multicriteria.cactiLayout.ruleKey=php:S1808
sonar.issue.ignore.multicriteria.cactiLayout.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.cactiFunctionNames.ruleKey=php:S100
sonar.issue.ignore.multicriteria.cactiFunctionNames.resourceKey=**/*.php

# Migration classes carry a version prefix so they sort in apply order
# (M001Foundation, M002Discovery); php:S101 expects plain PascalCase.
sonar.issue.ignore.multicriteria.migrationClassNames.ruleKey=php:S101
sonar.issue.ignore.multicriteria.migrationClassNames.resourceKey=src/Storage/Migrations/**

# Cacti pages must chdir('../../') and include('./include/auth.php') to load
# core authentication, so php:S4833 (prefer namespaces to include/require)
# does not fit the glue files. php:S2003 is a bug rule and stays enabled.
sonar.issue.ignore.multicriteria.cactiIncludesSetup.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.cactiIncludesSetup.resourceKey=setup.php
sonar.issue.ignore.multicriteria.cactiIncludesPage.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.cactiIncludesPage.resourceKey=cloudflare_accounts.php
sonar.issue.ignore.multicriteria.cactiIncludesIncludes.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.cactiIncludesIncludes.resourceKey=includes/**/*.php

# Hook callbacks have signatures fixed by Cacti's plugin API, so their
# unused parameters cannot be removed (php:S1172).
sonar.issue.ignore.multicriteria.cactiHookParamsSetup.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.cactiHookParamsSetup.resourceKey=setup.php
sonar.issue.ignore.multicriteria.cactiHookParamsPage.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.cactiHookParamsPage.resourceKey=cloudflare_accounts.php
sonar.issue.ignore.multicriteria.cactiHookParamsIncludes.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.cactiHookParamsIncludes.resourceKey=includes/**/*.php
