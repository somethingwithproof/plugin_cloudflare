<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Cacti Cloudflare plugin logo</title>
  <desc id="desc">A hand-drawn green saguaro cactus beside a stone tunnel portal with a road running into it. A smiling white cloud sits on the portal and drips raindrops toward the cactus.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3ec6d"/>
      <stop offset="0.55" stop-color="#2f9e2f"/>
      <stop offset="1" stop-color="#16701a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead9b4"/>
      <stop offset="1" stop-color="#c2a273"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#3b4656"/>
    </linearGradient>
  </defs>

  <g stroke="#111" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tunnel portal -->
    <path d="M22 186 V96 C22 38 150 38 150 96 V186 Z" fill="url(#stone)"/>
    <path d="M46 186 V102 C46 66 126 66 126 102 V186 Z" fill="url(#depth)"/>

    <!-- road into the tunnel -->
    <path d="M58 186 L114 186 L96 120 L76 120 Z" fill="#59626e" stroke-width="2.5"/>
  </g>
  <g fill="#f4f1e8">
    <rect x="84.5" y="170" width="3" height="12" rx="1"/>
    <rect x="85" y="150" width="2.4" height="9" rx="1"/>
    <rect x="85.3" y="134" width="1.8" height="7" rx="0.9"/>
  </g>

  <!-- a friendly cloud resting on the portal; the outline comes from a
       thicker black copy of the same circles drawn underneath -->
  <g fill="#111">
    <circle cx="36" cy="44" r="16"/>
    <circle cx="56" cy="30" r="21"/>
    <circle cx="80" cy="33" r="18"/>
    <circle cx="97" cy="46" r="14"/>
    <circle cx="66" cy="50" r="17"/>
    <circle cx="46" cy="53" r="14"/>
    <circle cx="86" cy="54" r="12"/>
  </g>
  <g fill="#ffffff">
    <circle cx="36" cy="44" r="12.5"/>
    <circle cx="56" cy="30" r="17.5"/>
    <circle cx="80" cy="33" r="14.5"/>
    <circle cx="97" cy="46" r="10.5"/>
    <circle cx="66" cy="50" r="13.5"/>
    <circle cx="46" cy="53" r="10.5"/>
    <circle cx="86" cy="54" r="8.5"/>
  </g>
  <path d="M30 52 C40 62 84 64 100 52 C96 60 84 64 66 64 C48 64 36 60 30 52 Z" fill="#cfe3f7"/>
  <!-- face -->
  <ellipse cx="58" cy="41" rx="3" ry="4" fill="#111"/>
  <ellipse cx="76" cy="41" rx="3" ry="4" fill="#111"/>
  <circle cx="59" cy="39.5" r="1.1" fill="#fff"/>
  <circle cx="77" cy="39.5" r="1.1" fill="#fff"/>
  <path d="M61 49 Q67 55 73 49" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="51" cy="48" r="3.5" fill="#f7a9b8" opacity="0.8"/>
  <circle cx="83" cy="48" r="3.5" fill="#f7a9b8" opacity="0.8"/>

  <!-- raindrops for the cactus -->
  <g fill="#7cc4f2" stroke="#111" stroke-width="2" stroke-linejoin="round">
    <path d="M108 62 C108 62 102 70 102 74 A6 6 0 0 0 114 74 C114 70 108 62 108 62 Z"/>
    <path d="M120 68 C120 68 116 73 116 76 A4 4 0 0 0 124 76 C124 73 120 68 120 68 Z"/>
  </g>

  <!-- saguaro -->
  <g fill="url(#skin)" stroke="#111" stroke-width="3.5" stroke-linejoin="round">
    <path d="M131 141 C118 141 104 137 104 121 L104 99 C104 85 120 85 120 99 L120 120 C120 125 124 127 131 127 Z"/>
    <path d="M160 119 C168 119 172 116 172 110 L172 82 C172 68 188 68 188 82 L188 112 C188 129 175 134 160 134 Z"/>
    <path d="M132 192 C129 150 127 104 129 76 C130 56 160 54 161 76 C163 104 162 150 159 192 Z"/>
  </g>

  <!-- ribs -->
  <g stroke="#e6f7c0" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M138 70 C136 100 136 150 138 186"/>
    <path d="M145 64 C145 100 145 150 145 188"/>
    <path d="M152 70 C154 100 154 150 152 186"/>
    <path d="M112 94 V122"/>
    <path d="M180 78 V114"/>
  </g>
</svg>
