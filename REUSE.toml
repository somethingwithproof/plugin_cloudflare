# Files that cannot carry an inline header (data, documentation, images,
# fixtures, translation catalogs, generated files). Source files carry
# their own SPDX header.
version = 1

[[annotations]]
path = ["**/*.md", "**/*.json", "**/*.lock", "**/*.svg", "**/*.png", "**/*.gif", "**/*.jpg",
        "**/*.xml", "**/*.dist", "**/*.po", "**/*.pot", "**/*.mo", "**/*.rrd", "**/*.txt",
        "LICENSE", ".github/CODEOWNERS", "tests/Fixtures/**", "locales/**", "templates/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Thomas Vincent <thomasvincent@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-or-later"
