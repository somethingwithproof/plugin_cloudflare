# SPDX-License-Identifier: GPL-2.0-or-later
name: CI

on:
  push:
    branches: [main]
  # Every PR, including PRs in a stack whose base is another feature branch.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CF_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=cacti_cf_test;charset=utf8'
  CF_TEST_DB_USER: cacti
  CF_TEST_DB_PASS: cacti

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, openssl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: php-cs-fixer (dry run)
        run: make cs
      - name: PHPStan
        run: make stan
      # The plugin's syntax floor is PHP 7.4 (docs/design.md, Runtime floor).
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: none
      - name: php -l on PHP 7.4
        run: |
          set -euo pipefail
          php -v | head -n 1
          find . -name vendor -prune -o -name .git -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l >/dev/null

  unit:
    name: unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit unit suite
        run: make test

  integration:
    name: integration (${{ matrix.db.name }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
        db:
          - name: MariaDB 10.11
            image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
            health: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.4
            image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
            health: mysqladmin ping -h 127.0.0.1 -ucacti -pcacti
    services:
      db:
        image: ${{ matrix.db.image }}
        # Each image reads only its own prefix.
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cacti_cf_test
          MARIADB_USER: cacti
          MARIADB_PASSWORD: cacti
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cacti_cf_test
          MYSQL_USER: cacti
          MYSQL_PASSWORD: cacti
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      # CI=true makes an unreachable database fail the suite instead of
      # skipping it (tests/Support/TestDatabase.php).
      - name: PHPUnit integration suite
        run: make test-integration

  bdd:
    name: bdd
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cacti_cf_test
          MARIADB_USER: cacti
          MARIADB_PASSWORD: cacti
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, openssl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Behat
        run: make bdd

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
          persist-credentials: false
      - name: Checkout Cacti 1.2.31
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Cacti/cacti
          ref: release/1.2.31
          path: cacti
          persist-credentials: false
      - name: Install smoke on Cacti 1.2.31
        working-directory: plugin
        run: make cacti-src smoke CACTI_REPO="$GITHUB_WORKSPACE/cacti" CACTI_REF=HEAD

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      # Advisories fail the job. Abandoned packages are only reported
      # (composer.json config.audit.abandoned): behat/transliterator is an
      # abandoned dev-only dependency of behat with no replacement.
      - name: composer audit
        run: composer audit --locked --no-interaction

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and check the release archive
        run: make package
