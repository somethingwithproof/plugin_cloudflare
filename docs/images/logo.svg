<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare plugin for Cacti</title>
  <desc id="desc">A green cactus standing in front of a sky-blue cloud, with a white line chart rising across the cloud. Below it, the text "Cloudflare plugin for Cacti".</desc>

  <!-- cloud -->
  <g fill="#4aa3df">
    <circle cx="122" cy="228" r="58"/>
    <circle cx="232" cy="176" r="92"/>
    <circle cx="306" cy="226" r="60"/>
    <rect x="64" y="226" width="302" height="58" rx="28"/>
  </g>

  <!-- rising line chart -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="226,262 262,232 300,252 340,206"/>
  </g>
  <g fill="#ffffff" stroke="#4aa3df" stroke-width="3">
    <circle cx="262" cy="232" r="10"/>
    <circle cx="300" cy="252" r="10"/>
    <circle cx="340" cy="206" r="11"/>
  </g>

  <!-- cactus: a white copy underneath keeps a gap between it and the cloud -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round">
    <rect x="150" y="58" width="54" height="226" rx="27"/>
    <rect x="98" y="118" width="40" height="98" rx="20"/>
    <rect x="98" y="178" width="80" height="38" rx="19"/>
    <rect x="216" y="160" width="38" height="74" rx="19"/>
    <rect x="178" y="200" width="76" height="34" rx="17"/>
  </g>
  <g fill="#3fa34d">
    <rect x="150" y="58" width="54" height="226" rx="27"/>
    <rect x="98" y="118" width="40" height="98" rx="20"/>
    <rect x="98" y="178" width="80" height="38" rx="19"/>
    <rect x="216" y="160" width="38" height="74" rx="19"/>
    <rect x="178" y="200" width="76" height="34" rx="17"/>
  </g>

  <text fill="#2b2f33" x="200" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="0.5">Cloudflare plugin for Cacti</text>
</svg>
