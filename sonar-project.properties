sonar.host.url=https://sonarcloud.io
sonar.organization=somethingwithproof
sonar.projectKey=somethingwithproof_plugin_cloudflare
sonar.projectName=Cacti Cloudflare Plugin
sonar.sourceEncoding=UTF-8

# Production code only; tests and BDD steps are analysed as tests.
sonar.sources=src,includes,setup.php,cloudflare_accounts.php,js
sonar.tests=tests,features
sonar.exclusions=vendor/**

# Written by `make coverage` in .github/workflows/sonar.yml.
sonar.php.coverage.reportPaths=build/coverage/clover.xml
